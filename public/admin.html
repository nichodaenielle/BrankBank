<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brain Bank · Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
[hidden]{display:none!important}
.adm-shell{max-width:1150px;margin:0 auto;padding:0 14px 40px}
.adm-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0;flex-wrap:wrap}
.adm-brand{display:flex;align-items:center;gap:10px;font-family:Fredoka;font-weight:700;font-size:1.3rem;color:#fff}
.adm-brand small{font-family:Nunito;font-weight:700;font-size:.75rem;color:rgba(255,255,255,.7)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{border:0;border-radius:12px;padding:10px 18px;font-family:Fredoka;font-weight:600;font-size:1rem;background:rgba(255,255,255,.14);color:#fff;transition:background .15s}
.tabs button.on{background:var(--gold);color:#3b2a00}
.paper{background:var(--paper);border:3px solid var(--purple);outline:2px solid #fff;outline-offset:-8px;border-radius:14px;padding:clamp(14px,2.5vw,24px)}
/* sets */
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.set-card{background:#fff;border:2px solid #e1dbc0;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.set-card .sc-head{display:flex;align-items:center;gap:10px}
.set-card .sc-icon{font-size:1.8rem}
.set-card .sc-name{font-family:Fredoka;font-weight:700;font-size:1.1rem;flex:1;min-width:0}
.set-card .sc-meta{font-size:.8rem;color:#667;font-weight:700}
.set-card .sc-topics{display:flex;flex-wrap:wrap;gap:6px}
.set-card .sc-topics span{background:#e6f4f0;color:var(--teal-d);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:800}
.set-card .sc-count{font-size:.85rem;font-weight:800;color:var(--gold-d)}
.set-card .sc-acts{display:flex;gap:8px;margin-top:auto}
.set-new{border:3px dashed #cfc8a8;border-radius:14px;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;min-height:140px;font-family:Fredoka;font-weight:600;font-size:1.05rem;color:#8a7a55;cursor:pointer;transition:all .15s}
.set-new:hover{border-color:var(--teal);color:var(--teal-d);background:#fff}
/* questions */
.q-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.q-filters input,.q-filters select{padding:9px 12px;border-radius:10px;border:2px solid var(--teal);font-size:.95rem;background:#fff;font-family:inherit}
.q-filters input{flex:1;min-width:160px}
.q-list{display:flex;flex-direction:column;gap:8px}
.q-row{background:#fff;border:2px solid #e1dbc0;border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.q-row .q-main{flex:1;min-width:0}
.q-row .q-top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.q-row p{margin:0;font-weight:600;line-height:1.4}
.q-row .q-id{font-size:.75rem;color:#999;font-weight:700}
.chip.t100{background:#e6f4f0;color:var(--teal-d)}.chip.t200{background:#e3f0ff;color:#2b5cb8}.chip.t300{background:#fff3d6;color:#8a6d00}.chip.t400{background:#ffe9ec;color:#b03060}.chip.t500{background:#efe6ff;color:#5b3aa8}
.chip.plain{background:#eee;color:#555}
/* editor */
.ed-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ed-form .full{grid-column:1/-1}
.ed-form label{display:block;font-weight:800;font-size:.85rem;margin-bottom:4px}
.ed-form input,.ed-form select,.ed-form textarea{width:100%;padding:10px 12px;border:2px solid #cfc8a8;border-radius:10px;font-size:.95rem;font-family:inherit;background:#fff}
.ed-form textarea{min-height:70px;resize:vertical}
.ed-form input:focus,.ed-form select:focus,.ed-form textarea:focus{outline:none;border-color:var(--teal)}
.ed-type{background:#fffbe8;border:2px dashed var(--gold);border-radius:12px;padding:12px}
.ed-type h4{margin:0 0 8px;font-family:Fredoka;color:#8a6d00}
.opt-list{display:flex;flex-direction:column;gap:6px}
.opt-row{display:flex;gap:8px;align-items:center}
.opt-row input[type=text]{flex:1}
.opt-row .rm,.kv-row .rm,.topic-row .rm{border:0;background:#fde3e3;color:var(--red);border-radius:8px;width:30px;height:30px;font-weight:800;flex:none}
.add-opt{margin-top:6px}
.kv-list{display:flex;flex-direction:column;gap:6px}
.kv-row{display:grid;grid-template-columns:1fr 1fr 30px;gap:6px}
.topic-row{display:grid;grid-template-columns:44px 1fr 1fr 30px;gap:8px;align-items:center;margin-bottom:8px}
.topic-row input{padding:9px 10px;border:2px solid #cfc8a8;border-radius:10px;font-size:.95rem;font-family:inherit;background:#fff;text-align:center}
.topic-row input.ic{font-size:1.2rem}
.topic-row input.name{text-align:left}
.topic-row input.tid{font-family:monospace;font-size:.85rem;color:#667}
.topic-row .tq{font-size:.72rem;color:#999;font-weight:700;grid-column:2/4}
.ed-acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;position:sticky;bottom:0;background:var(--paper);padding:10px 0}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{max-width:380px;width:100%}
.login-card h1{margin:.2em 0;color:var(--teal-d)}
.err-msg{color:var(--red);font-weight:700;min-height:1.2em;margin-top:8px}
.count-note{color:#667;font-weight:700;font-size:.9rem}
.hint-note{font-size:.8rem;color:#8a7a55;font-weight:600}
@media(max-width:640px){.ed-form{grid-template-columns:1fr}.topic-row{grid-template-columns:44px 1fr 30px}.topic-row input.tid{grid-column:2/4}}
</style>
</head>
<body>
<div id="login-view" class="login-wrap" hidden>
  <div class="notebook login-card"><div class="spiral"></div><div class="paper">
    <h1>🛠️ Admin Login</h1>
    <p class="tag">Teacher access to Brain Bank</p>
    <label class="lbl" for="adm-pass">Admin password</label>
    <input id="adm-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    <p class="err-msg" id="login-err"></p>
    <button class="btn big gold wide" id="btn-login">Log in</button>
    <p style="text-align:center;margin-top:14px"><a href="/" style="color:var(--teal-d);font-weight:700">← Back to game</a></p>
  </div></div>
</div>

<div class="adm-shell" id="app-view" hidden>
  <header class="adm-top">
    <div class="adm-brand">🛠️ Brain Bank <small>Admin · question bank</small></div>
    <div><span class="count-note" id="stat-line"></span> <button class="btn small ghost" id="btn-logout" style="color:#fff;border-color:rgba(255,255,255,.5)">Log out</button></div>
  </header>

  <nav class="tabs">
    <button class="on" data-tab="questions">📝 Questions</button>
    <button data-tab="sets">📚 Sets &amp; Topics</button>
  </nav>

  <!-- QUESTIONS TAB -->
  <section id="tab-questions">
    <div class="paper">
      <div class="q-filters">
        <input id="f-q" placeholder="🔍 Search questions…">
        <select id="f-set"><option value="">All sets</option></select>
        <select id="f-topic"><option value="">All topics</option></select>
        <select id="f-tier"><option value="">All values</option><option>100</option><option>200</option><option>300</option><option>400</option><option>500</option></select>
        <select id="f-type"><option value="">All types</option></select>
        <button class="btn teal" id="btn-new">＋ New question</button>
      </div>
      <div class="q-list" id="q-list"></div>
    </div>
  </section>

  <!-- SETS TAB -->
  <section id="tab-sets" hidden>
    <div class="set-grid" id="set-grid"></div>
  </section>
</div>

<!-- QUESTION EDITOR -->
<div class="modal" id="ed-modal" hidden>
  <div class="card-box" style="width:min(760px,100%)" role="dialog" aria-modal="true">
    <div class="card-head"><span class="chip type" id="ed-kind">Question</span><span class="value" id="ed-title">Edit</span></div>
    <div class="ed-form" id="ed-form"></div>
    <div class="ed-acts">
      <button class="btn ghost" id="ed-cancel">Cancel</button>
      <button class="btn gold" id="ed-save">💾 Save question</button>
    </div>
    <p class="err-msg" id="ed-err"></p>
  </div>
</div>

<!-- SET EDITOR -->
<div class="modal" id="set-modal" hidden>
  <div class="card-box" style="width:min(680px,100%)" role="dialog" aria-modal="true">
    <div class="card-head"><span class="chip">Set</span><span class="value" id="set-title">New set</span></div>
    <div class="ed-form" id="set-form">
      <div><label>Set ID <span class="hint-note">(auto from name — lowercase, dashes)</span></label><input id="s-id" placeholder="math-g7s1"></div>
      <div><label>Icon (emoji)</label><input id="s-icon" maxlength="4" placeholder="📚"></div>
      <div class="full"><label>Name</label><input id="s-name" placeholder="e.g. Mathematics"></div>
      <div><label>Grade</label><input id="s-grade" type="number" min="1" max="12" placeholder="7"></div>
      <div><label>Semester</label><input id="s-semester" type="number" min="1" max="3" placeholder="1"></div>
      <div class="full"><label>Preview label</label><input id="s-label" placeholder="auto-generated"></div>
      <div class="full">
        <label>Topics <span class="hint-note" id="s-topics-hint"></span></label>
        <div id="s-topics"></div>
        <button class="btn small ghost add-opt" id="s-addt">＋ Add topic</button>
      </div>
    </div>
    <div class="ed-acts">
      <button class="btn red" id="s-delete" hidden>🗑️ Delete set</button>
      <span style="flex:1"></span>
      <button class="btn ghost" id="s-cancel">Cancel</button>
      <button class="btn gold" id="s-save">💾 Save set</button>
    </div>
    <p class="err-msg" id="set-err"></p>
  </div>
</div>
<!-- CONFIRM -->
<div class="modal" id="cf-modal" hidden>
  <div class="card-box" style="width:min(420px,100%)" role="alertdialog" aria-modal="true">
    <div class="card-head"><span class="chip type">⚠️ Confirm</span></div>
    <p id="cf-msg" style="font-weight:700;line-height:1.5"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
      <button class="btn ghost" id="cf-no">Cancel</button>
      <button class="btn red" id="cf-yes">Delete</button>
    </div>
  </div>
</div>

<script src="admin.js?v=2"></script>
</body>
</html>
